name: torchinlane
description: >-
  Flutter release CLI and local GUI for builds, localized store texts/images,
  release notes, credentials, signing, and GitHub Actions automation.
version: 0.2.9
repository: https://github.com/metekaganmusaak/torchinlane
topics:
  - flutter
  - fastlane
  - cli
  - deployment
  - app-store

environment:
  sdk: ^3.5.0

executables:
  torchinlane: torchinlane

dependencies:
  args: ^2.5.0
  yaml: ^3.1.2
  yaml_edit: ^2.2.1
  path: ^1.9.0
  http: ^1.2.2
  image: ^4.10.1

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0

screenshots:
  - description: "Torchinlane Package Logo"
    path: assets/logo.png
  - description: "Torchinlane Studio guided setup and readiness checklist"
    path: doc/studio.png
